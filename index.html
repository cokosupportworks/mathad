<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ますあど</title>
    
    <!-- アプリアイコンの設定 -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overscroll-behavior-y: none;
            touch-action: none; /* スワイプ操作などを完全に無効化 */
        }
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        /* ふわふわアニメーション */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        /* MASUADO ARCADE — clear numbers, tactile controls, a bright playfield. */
        :root { --ink:#252347; --cabinet:#242143; --mint:#72f1d5; --yellow:#ffe178; --pink:#ff8ca8; --violet:#a89aff; }
        body { background-color:#242143!important; background-image:radial-gradient(ellipse at 12% 0%,#48416f 0,transparent 52%),radial-gradient(ellipse at 100% 100%,#344765 0,transparent 48%); color:var(--ink); padding:18px 26px 0; gap:0; }
        body::before { content:''; position:absolute; inset:0; opacity:.08; pointer-events:none; background-image:radial-gradient(#fff 1px,transparent 1px); background-size:12px 12px; }
        button,input { font:inherit; }
        button { -webkit-tap-highlight-color:transparent; }
        button:focus-visible,input:focus-visible { outline:4px solid #f5bd40!important; outline-offset:4px; }
        button:disabled { cursor:not-allowed; }
        .hidden { display:none!important; }
        #titleScreen { margin:0; }
        #titleScreen button { box-shadow:none; }
        #arcadeHeader { background:none; box-shadow:none; padding:0 0 18px; gap:16px; flex-direction:row; flex-shrink:0; align-items:center; }
        #arcadeHeader > div:first-child { gap:32px; width:auto; flex:1; justify-content:flex-start; }
        #arcadeHeader h1 { display:flex;align-items:center;margin:0;gap:12px; color:white; white-space:nowrap; }
        .brand-mark { display:grid; place-items:center; width:51px; height:51px; background:var(--yellow); border:2px solid #17152f; border-radius:17px; box-shadow:0 4px 0 #14122c, inset 0 2px 0 #fff9; transform:rotate(-7deg); }
        .brand-mark svg { width:29px;height:29px;color:var(--ink); }
        .brand-copy { display:flex;flex-direction:column;line-height:1.1; }
        .brand-copy strong { font-size:29px;letter-spacing:.06em; }
        .brand-copy small { font-size:10px;letter-spacing:.15em;color:#c6bfe6;margin-top:7px; }
        .mode-switch { margin:0!important;padding:5px!important;border-radius:17px!important;background:#15132d!important;gap:4px;border:1px solid #645c87;box-shadow:inset 0 2px 3px #0004; }
        .mode-switch button { min-height:43px; min-width:112px; border-radius:12px!important;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 16px!important;font-size:14px!important;transition:background .18s,transform .18s; }
        .mode-switch svg { width:18px;height:18px; }
        .mode-switch button[aria-pressed="true"] { background:var(--mint)!important;color:#1f3544!important;box-shadow:0 3px 0 #268f84,inset 0 2px 0 #fff8!important; }
        .mode-switch button[aria-pressed="false"] { background:transparent!important;color:#c9c2e6!important;box-shadow:none!important; }
        #controlsUI,#multiStatusUI { width:auto;gap:10px;flex-shrink:0; }
        #openSettingsBtn { width:46px;height:46px;border-radius:15px;background:#f5f1ff;color:#494069;box-shadow:0 4px 0 #aaa1c9;border:2px solid #fff7;padding:10px; }
        #openSettingsBtn svg { width:23px;height:23px; }
        #resetBtn,#leaveRoomBtn { min-height:46px;border-radius:15px;padding:10px 18px;background:var(--yellow);color:#44322c;box-shadow:0 4px 0 #bd8847,inset 0 2px 0 #fff8;border:2px solid #fff5;font-size:14px; }
        #leaveRoomBtn { background:#f4d9e8;box-shadow:0 4px 0 #b885a1; }
        #multiStatusUI > div { background:#14132d;color:#ccc5e5;border:1px solid #6b608e; }
        #currentRoomDisplay { color:var(--mint);max-width:100px;overflow:hidden;text-overflow:ellipsis; }
        #gameOverlayUI { position:relative;inset:auto;opacity:1!important;width:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:14px;padding:0 2px 15px;flex-shrink:0;pointer-events:none;min-height:86px; }
        .hud-timer { display:flex;align-items:center;gap:12px;color:white; }
        .hud-timer > svg { width:40px;height:40px;padding:9px;border-radius:14px;background:#393454;border:1px solid #6d658a;color:var(--yellow); }
        .hud-label { display:block;font-size:10px;letter-spacing:.13em;font-weight:700;color:#c4bddf; }
        .timer-value { font-size:29px;line-height:1.15;letter-spacing:.03em;font-variant-numeric:tabular-nums; }
        .timer-value small { color:#c4bddf;font-size:11px;padding-left:5px; }
        .hud-mission { text-align:center;color:white;min-width:156px; }
        .hud-mission .hud-label { margin-bottom:2px; }
        .mission-value { font-size:15px;line-height:1.3;display:flex;align-items:baseline;justify-content:center;gap:8px;color:#c4bddf; }
        #reachedCount { font-size:30px;color:var(--mint);font-variant-numeric:tabular-nums; }
        #goalCount { color:#fff;font-size:19px; }
        .mini-meter { height:5px;background:#14132e;border-radius:9px;margin:6px 4px 0;overflow:hidden; }
        #hudProgress { display:block;height:100%;width:0;background:var(--mint);border-radius:9px;transition:width .2s ease; }
        .hud-race { display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0; }
        .solo-badge { display:flex;align-items:center;gap:10px;border:1px solid #6c6289;border-radius:16px;padding:10px 16px;background:#3a3356;color:white; }
        .solo-badge svg { width:28px;height:28px;color:var(--yellow); }
        .solo-badge span { display:block;font-size:10px;color:#c4bddf; }
        .solo-badge strong { display:block;font-size:17px;letter-spacing:.04em; }
        #multiRankUI { padding:4px 10px;border-radius:12px;background:var(--yellow);color:#302640;border:2px solid #fff6;box-shadow:0 3px 0 #ab7b42;font-size:15px;white-space:nowrap; }
        #currentRankDisplay { font-size:26px; }
        #multiplayerMarathon { max-width:none;min-width:60px;width:130px;height:32px;border:2px solid #8a80a4;background:#14132d;box-shadow:inset 0 3px 0 #0003;padding-left:10px;padding-right:24px; }
        #canvasContainer { position:relative;width:auto;height:0;min-height:100px;flex:1 1 0%;border-radius:28px;border:5px solid #121128;outline:1px solid #6e658b;box-shadow:0 5px 0 #121128,0 0 0 5px #3c365b,inset 0 0 40px #b7b4d43b;background-color:#f4f6fe;background-image:radial-gradient(#9ba6c03b 1px,transparent 1px),radial-gradient(ellipse at 10% 0%,#d8f8f180,transparent 52%),radial-gradient(ellipse at 100% 100%,#e7defb9c,transparent 55%);background-size:22px 22px,100% 100%,100% 100%;isolation:isolate; }
        #canvasContainer::after { content:'';position:absolute;inset:8px;border:1px solid #a7a3c43b;border-radius:15px;pointer-events:none;z-index:1; }
        #gameCanvas { z-index:2; }
        #feedbackCanvas { position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4; }
        #confettiCanvas { z-index:12; }
        .cabinet-footer { height:65px;display:flex;align-items:center;justify-content:space-between;padding:5px 6px 0;flex-shrink:0;position:relative;gap:15px; }
        .footer-instruction { display:flex;align-items:center;gap:11px;color:#eee9ff;font-size:13px; }
        .footer-instruction svg { width:24px;height:24px;color:var(--mint); }
        .footer-instruction b { color:var(--yellow);font-size:16px; }
        .footer-steps { display:flex;gap:7px;align-items:center;color:#81759d;font-size:13px; }
        .footer-steps span { width:26px;height:26px;display:grid;place-items:center;border:1px solid #82739d;border-radius:8px;color:#cec4e6;background:#39314f;box-shadow:0 3px 0 #15132b; }
        .cabinet-signature { color:#aaa0c4;font-size:9px;letter-spacing:.15em;display:flex;gap:8px;align-items:center; }
        .cabinet-signature i { width:6px;height:6px;background:var(--mint);border-radius:50%;box-shadow:0 0 8px #72f1d570; }
        #multiModal { background:#151229a8;backdrop-filter:blur(9px);padding:22px;touch-action:pan-y; }
        #multiModal > div { border:3px solid #302847;border-radius:27px;box-shadow:0 8px 0 #151126,0 22px 70px #09061966;background:#fffdf7;max-height:calc(100dvh - 44px);overflow-y:auto;touch-action:pan-y; }
        #multiModal > div::before { content:'';display:block;width:44px;height:5px;border-radius:4px;background:#d9d1e9;position:absolute;top:12px;left:calc(50% - 22px); }
        #multiModal h2 { color:#332949;letter-spacing:.01em;margin-top:12px; }
        #multiModal label { color:#4b4160; }
        #multiModal input[type="text"],#multiModal input[type="number"] { border:2px solid #d3cae3;background:white;border-radius:13px;box-shadow:inset 0 3px 0 #f1edf7;color:#332949;min-height:46px; }
        #multiModal input:disabled { background:#eeeaf5;color:#746a83; }
        #roomSetupUI > div:first-child { display:none; }
        #multiModal button:not([id^="close"]):not(#cancelWaitingBtn) { border:2px solid #312545;border-radius:15px;box-shadow:0 5px 0 #302445;transition:transform .14s,box-shadow .14s;background:var(--mint);color:#263b42; }
        #multiModal #startMultiBtn,#multiModal #joinRoomBtn { background:var(--yellow);color:#3d3043; }
        #multiModal #startMultiBtn:disabled { opacity:1;background:#e6e0ed;color:#82758e;box-shadow:0 4px 0 #beb2cb;border-color:#beb2cb; }
        #multiModal button[id^="close"],#cancelWaitingBtn { color:#81728e; }
        #playersList { background:#f0edf7;border-color:#dfd6e9;min-height:72px;max-height:174px;touch-action:pan-y; }
        .player-row { padding:9px 10px;display:flex;align-items:center;gap:10px;border-radius:12px;background:white;border:1px solid #e2daec;font-size:14px; }
        .player-row.is-me { border:2px solid #6edcc5;background:#effcf7; }
        .player-avatar { width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#e8e1ff;color:#5a4380;font-size:15px;border-bottom:3px solid #c7b8e5;flex-shrink:0; }
        .player-row.is-me .player-avatar { background:var(--mint);border-color:#46b49e;color:#254b45; }
        .player-name { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1; }
        .player-tag { font-size:10px;background:#ffe8a0;color:#70502c;border-radius:6px;padding:3px 6px;white-space:nowrap; }
        #settingsOwnerDisplay { color:#423452;font-size:14px;line-height:1.7; }
        #roomWaitingUI > div:has(#settingsOwnerDisplay) { background:#f4effc;border-color:#ddd1ef; }
        #waitingRoomWord { color:#66528e;overflow-wrap:anywhere; }
        #resultList { touch-action:pan-y; }
        #resultList > div { background:#f5f0fa;border:2px solid #e1d6ec;border-radius:15px; }
        #resultList > div:first-child { background:#fff1b8;border-color:#e7bb54; }
        #roomResultUI { overflow:visible; }
        #roomResultUI > div:first-child { top:-36px;filter:drop-shadow(0 6px 0 #302445); }
        #centerMessageText { font-size:clamp(48px,10vw,100px);color:#4c3679!important;text-shadow:3px 3px 0 #fff!important;filter:drop-shadow(0 6px 0 #b6a3dd); }
        #singleClearOverlay { background:#eeedffdb;backdrop-filter:blur(8px);padding:20px;gap:0; }
        .clear-emblem { width:88px;height:88px;display:grid;place-items:center;background:var(--yellow);color:#4e3263;border:4px solid #4e3263;border-radius:28px;box-shadow:0 7px 0 #b092be;transform:rotate(-7deg);margin-bottom:22px; }
        .clear-emblem svg { width:51px;height:51px; }
        .clear-kicker { letter-spacing:.22em;font-size:12px;color:#735794;margin-bottom:9px; }
        #singleClearOverlay h2 { color:#42315c;font-size:clamp(25px,5vw,56px);text-shadow:none!important;margin-bottom:18px;animation:none;white-space:nowrap; }
        #singleClearTime { color:#5c4384;background:white;border:2px solid #c9b7e2;border-radius:15px;box-shadow:0 4px 0 #d5c7e7;font-size:clamp(19px,3vw,28px);padding:12px 24px;margin-bottom:26px; }
        #nextBtn { background:var(--mint);color:#244942;border:3px solid #354549;border-radius:17px;box-shadow:0 6px 0 #354549;font-size:clamp(17px,3vw,23px);padding:15px 28px; }
        #arcadeHeader button:active:not(:disabled),#multiModal button:active:not(:disabled),#nextBtn:active { transform:translateY(3px);box-shadow:0 1px 0 #322742; }
        @media (hover:hover) { #arcadeHeader button:hover:not(:disabled),#nextBtn:hover { filter:brightness(1.06); } }
        @media (max-width:760px) {
            body { padding:12px 14px 0; }
            #arcadeHeader { flex-wrap:wrap;gap:12px;padding-bottom:14px; }
            #arcadeHeader > div:first-child { width:100%;gap:12px;justify-content:space-between; }
            .brand-mark { width:40px;height:40px;border-radius:13px; }
            .brand-mark svg { width:24px;height:24px; }
            .brand-copy strong { font-size:23px; }.brand-copy small { font-size:8px;margin-top:5px; }
            #arcadeHeader h1 { display:flex;align-items:center;margin:0;gap:8px; }
            .mode-switch button { min-width:82px;min-height:36px;font-size:12px!important;padding:6px 10px!important;gap:4px; }.mode-switch svg { width:15px;height:15px; }
            #controlsUI,#multiStatusUI { width:100%;justify-content:flex-end;gap:8px; }
            #openSettingsBtn { width:37px;height:37px;padding:7px;border-radius:12px; }
            #openSettingsBtn svg { width:19px;height:19px; }
            #resetBtn,#leaveRoomBtn { min-height:37px;padding:7px 13px;font-size:12px;border-radius:12px; }
            #gameOverlayUI { min-height:73px;padding:0 1px 12px;gap:8px; }
            .hud-timer { gap:7px; }.hud-timer > svg { display:none; }.timer-value { font-size:24px; }.hud-label { font-size:9px;letter-spacing:.04em; }
            .hud-mission { min-width:105px; }#reachedCount { font-size:25px; }#goalCount { font-size:16px; }.mission-value { gap:5px; }
            .solo-badge { border-radius:12px;padding:8px 10px;gap:6px; }.solo-badge svg { width:21px;height:21px; }.solo-badge strong { font-size:14px; }.solo-badge span { font-size:8px; }
            #multiplayerMarathon { display:none!important; }#multiRankUI { padding:2px 8px;font-size:13px; }#currentRankDisplay { font-size:24px; }
            #canvasContainer { border-width:4px;border-radius:22px;outline-color:#716588;box-shadow:0 4px 0 #121128,0 0 0 3px #3c365b; }
            #canvasContainer::after { inset:6px;border-radius:12px; }
            .cabinet-footer { height:57px;padding:6px 1px 0;gap:8px; }.footer-instruction { gap:7px;font-size:11px; }.footer-instruction b { font-size:14px; }.footer-instruction svg { width:21px;height:21px; }.cabinet-signature { display:none; }
            .footer-steps { gap:5px;font-size:10px; }.footer-steps span { width:22px;height:22px;border-radius:7px; }
            #multiModal { padding:15px; }#multiModal > div { padding:25px 20px 23px;max-height:calc(100dvh - 30px);border-radius:24px; }
            #multiModal h2 { font-size:23px; }
            .clear-emblem { width:65px;height:65px;border-radius:20px;margin-bottom:15px; }.clear-emblem svg { width:38px;height:38px; }
        }
        @media (max-width:370px) { body{padding:10px 10px 0}.brand-copy small{display:none}.brand-copy strong{font-size:21px}.mode-switch button{min-width:74px;padding:6px 7px!important}.mode-switch svg{display:none}.solo-badge svg{display:none}.footer-steps{display:none} }
        @media (max-height:550px) and (min-width:761px) { body{padding-top:10px}#arcadeHeader{padding-bottom:10px}.brand-mark{height:40px;width:40px}.brand-copy strong{font-size:23px}#gameOverlayUI{min-height:61px;padding-bottom:10px}.hud-mission .hud-label{display:none}.cabinet-footer{height:43px}.clear-emblem{display:none} }
        @media (orientation:landscape) and (max-height:500px) and (max-width:760px) { body{padding-top:8px}#arcadeHeader{flex-wrap:nowrap;padding-bottom:9px;gap:10px}#arcadeHeader>div:first-child{width:auto;gap:16px}#controlsUI,#multiStatusUI{width:auto}.brand-copy small{display:none}.brand-mark{width:32px;height:32px}.brand-copy strong{font-size:20px}.mode-switch button{min-width:72px;min-height:32px}#gameOverlayUI{min-height:48px;padding-bottom:8px}.hud-label{font-size:8px}.timer-value{font-size:20px}#reachedCount{font-size:21px}.hud-mission .hud-label{display:none}.mini-meter{margin-top:3px}.solo-badge{padding:4px 8px}.cabinet-footer{height:36px}.clear-emblem{display:none}#singleClearOverlay h2{margin-bottom:10px}#singleClearTime{margin-bottom:14px} }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important;transition:none!important;scroll-behavior:auto!important; } }
        body { touch-action:manipulation; }
        .mode-switch button { white-space:nowrap; }
        .solo-badge span { white-space:nowrap; }
        @media (max-width:420px) { .mode-switch svg,.solo-badge svg { display:none; }.mode-switch button { min-width:76px; }.footer-steps { display:none; }.cabinet-footer { justify-content:center; }.footer-instruction { white-space:nowrap; } }
        #multiModal #startMultiBtn,#multiModal #joinRoomBtn { background:var(--yellow)!important; }
        #multiModal #startMultiBtn:disabled { background:#e6e0ed!important; }
        #playersList { max-height:220px; }
        @media (max-height:650px) {
            #multiModal > div { padding:22px 18px 18px; }
            #roomWaitingUI h2 { font-size:21px;margin-top:8px;margin-bottom:6px; }
            #roomWaitingUI > .text-center { padding:5px;margin-bottom:12px; }
            #playersList { padding:8px;max-height:152px;margin-bottom:12px; }
            .player-row { padding:5px 8px;gap:8px;font-size:12px; }
            .player-avatar { width:26px;height:26px;font-size:12px; }
            .player-tag { font-size:9px;padding:3px 4px; }
            #roomWaitingUI > div:has(#settingsOwnerDisplay) { padding:12px;margin-bottom:12px; }
            #settingsOwnerDisplay { font-size:12px;line-height:20px;margin-bottom:8px; }
            #multiSettingsHint { font-size:11px;line-height:17px;margin-top:6px; }
            #multiModal #multiBallCount { min-height:40px;padding:6px;font-size:16px; }
            #multiModal #startMultiBtn { padding:10px;font-size:18px; }
            .clear-emblem { display:none; }
            #singleClearOverlay h2 { margin-bottom:12px; }
            #singleClearTime { padding:9px 18px;margin-bottom:18px; }
        }
        #marathonTrack .bg-orange-500 { background:var(--mint);color:#254b45; }
        #marathonTrack .bg-blue-400 { background:#bba9ea;color:#3d2d5b; }
        #roomResultUI { overflow-y:auto;overflow-x:hidden; }
        #roomResultUI > div.result-emblem { position:relative;inset:auto;transform:rotate(-6deg);width:68px;height:68px;display:grid;place-items:center;background:var(--yellow);border:3px solid #4e3263;border-radius:21px;color:#4e3263;box-shadow:0 5px 0 #c9aad4;filter:none;margin:10px auto 18px; }
        .result-emblem svg { width:40px;height:40px; }

        /* A full-screen arcade finish, above both the board and its result panel. */
        #confettiCanvas { position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;z-index:75!important;pointer-events:none!important; }
        #victoryShow { position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:hidden;pointer-events:none;isolation:isolate; }
        #victoryShow .victory-backdrop { position:absolute;inset:-60%;background:repeating-conic-gradient(from -9deg at 50% 50%,#794bdd 0deg 15deg,#50309b 15deg 30deg);animation:victory-rays 2.6s ease-out both; }
        #victoryShow .victory-halo { position:absolute;width:min(120vw,1100px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff7b1 0,#ffe876c9 18%,#ff9be355 43%,transparent 66%);animation:victory-halo 2.6s ease-out both; }
        .victory-banner { position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;transform-origin:50% 60%;width:100%;padding:24px 12px;animation:victory-slam 2.6s cubic-bezier(.18,.85,.22,1) both; }
        .victory-crown { width:clamp(100px,18vh,185px);height:clamp(100px,18vh,185px);filter:drop-shadow(0 10px 0 #351b61);transform:rotate(-9deg); }
        .victory-crown svg { width:100%;height:100%;overflow:visible; }
        #victoryTitle { position:relative;margin:0;color:#ffe969;font-size:clamp(68px,17vw,210px);line-height:1.2;letter-spacing:-.065em;white-space:nowrap;font-weight:900;-webkit-text-stroke:clamp(2px,.45vw,6px) #fff;paint-order:stroke fill;text-shadow:0 5px 0 #e48b31,0 10px 0 #a74a36,0 15px 0 #351a57,7px 16px 0 #351a57;transform:rotate(-7deg); }

    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        
        // Settings UI
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const settingsUI = document.getElementById('settingsUI');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const applySettingsBtn = document.getElementById('applySettingsBtn');
        const voiceToggle = document.getElementById('voiceToggle');
        const seToggle = document.getElementById('seToggle');
        const ballCountInput = document.getElementById('ballCount');
        const multiBallCountInput = document.getElementById('multiBallCount');
        const startMultiBtn = document.getElementById('startMultiBtn');

        // Single Player UI
        const singleClearOverlay = document.getElementById('singleClearOverlay');
        const timerDisplay = document.getElementById('timerDisplay');
        const gameOverlayUI = document.getElementById('gameOverlayUI');
        
        // Mode Tabs & Controls
        const modeSingleBtn = document.getElementById('modeSingleBtn');
        const modeMultiBtn = document.getElementById('modeMultiBtn');
        const controlsUI = document.getElementById('controlsUI');
        const multiStatusUI = document.getElementById('multiStatusUI');
        
        // Multi Player Modals
        const multiModal = document.getElementById('multiModal');
        const roomSetupUI = document.getElementById('roomSetupUI');
        const roomWaitingUI = document.getElementById('roomWaitingUI');
        const roomResultUI = document.getElementById('roomResultUI');
        const customAlertUI = document.getElementById('customAlertUI');
        const centerMessage = document.getElementById('centerMessage');
        const titleScreen = document.getElementById('titleScreen');
        const closeSetupBtn = document.getElementById('closeSetupBtn');
        const cancelWaitingBtn = document.getElementById('cancelWaitingBtn');

        // --- App State ---
        let gameMode = 'single'; // 'single' | 'multi'
        let ballsData = []; // 配置の割合データ {x, y, r, n}
        let balls = []; // 実際の描画用データ（ピクセル）
        let targetNumber = 1;
        
        let isDrawing = false;
        let isDrawingAllowed = false; // タッチ操作を許可するか
        let pointerPos = { x: 0, y: 0 };
        
        let timerInterval = null;
        let startTime = 0;
        let finalTime = 0;
        let hasStartedTimer = false;

        let isVoiceEnabled = true;
        let isSoundEffectsEnabled = true;
        let previousBallCount = 10;

        // ==========================================
        // ★ロック画面対策: オーディオ処理の完全リニューアル
        // ==========================================
        // iOSで勝手にメディアプレイヤーが表示されるのを防ぐため、<audio>タグを廃止し、
        // すべて Web Audio API を使ってメモリ上（バッファ）から音を鳴らす仕組みに変更しました。

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContextClass(); // 初期状態は suspended (停止中)
        
        const audioBuffers = {
            goal: null,
            yokudekimashita: null,
            enter: null,
            click: null,
            win: null,
            lose: null
        };

        // 音声ファイルのプリロード（バックグラウンドで読み込んで準備しておく）
        async function loadAudioBuffer(url, key) {
            try {
                const response = await fetch(url);
                if (!response.ok) return;
                const arrayBuffer = await response.arrayBuffer();
                audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                    audioBuffers[key] = buffer;
                }, (e) => { /* デコードエラーは無視 */ });
            } catch (e) {
                // プレビュー環境などでファイルが見つからない・URLが無効な場合のエラーを無視します
                console.log(`音声ファイル (${url}) の読み込みをスキップしました。実際の公開環境で同じフォルダにファイルが配置されていれば正しく再生されます。`);
            }
        }

        // アプリを開いた瞬間に裏でこっそり音声を読み込んでおく
        loadAudioBuffer('goal.mp3', 'goal');
        loadAudioBuffer('yokudekimashita.mp3', 'yokudekimashita');
        loadAudioBuffer('enter.mp3', 'enter');
        loadAudioBuffer('click.mp3', 'click');
        loadAudioBuffer('win.mp3', 'win');
        loadAudioBuffer('lose.mp3', 'lose');

        // バッファの再生関数
        function playBuffer(key) {
            // ユーザーが画面に触れていれば音声を再生
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!audioBuffers[key]) return; // 読み込みが間に合っていなければ鳴らさない
            
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[key];
            source.connect(audioCtx.destination);
            source.start(0);
            return source;
        }

        function getPentatonicFreq(index) {

        function playSparkleNote(freq) {
            if (!audioCtx || !isSoundEffectsEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const t = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.value = freq;
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            
            gain1.gain.setValueAtTime(0, t);
            // ★ メイン音の音量を 0.08 から 0.025 に下げました
            gain1.gain.linearRampToValueAtTime(0.025, t + 0.02);
            gain1.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
            osc1.start(t);
            osc1.stop(t + 1.2);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.value = freq * 2; 
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            
            gain2.gain.setValueAtTime(0, t);
            // ★ キラキラ成分の音量を 0.03 から 0.01 に下げました
            gain2.gain.linearRampToValueAtTime(0.01, t + 0.02);
            gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
            osc2.start(t);
            osc2.stop(t + 0.8);
        }

            gain.gain.linearRampToValueAtTime(0.1, t + 0.05);

        // --- ゲームコア ロジック (配置生成) ---
        function generateBallsData(count) {
            count = normalizeBallCount(count);
            let data = [];
            let baseRadiusRatio = 0.08;
            if (count > 50) baseRadiusRatio *= 0.4;
            else if (count > 30) baseRadiusRatio *= 0.6;
            else if (count > 15) baseRadiusRatio *= 0.8;

            const minRadiusRatio = 0.02; 
            let actualRadiusRatio = Math.max(baseRadiusRatio, minRadiusRatio);
            const marginRatio = 0.01;
            const paddingRatio = actualRadiusRatio + marginRatio;

            // 情報パネルは盤面の外に配置し、数字には画面全体を使う。
            const topMarginRatio = 0.02;

            let placedAll = false;

            while (!placedAll && actualRadiusRatio >= minRadiusRatio) {
                data = [];
                placedAll = true;

                for (let i = 1; i <= count; i++) {
                    let placed = false;
                    let attempts = 0;

                    while (!placed && attempts < 200) {
                        const x = paddingRatio + Math.random() * (1 - paddingRatio * 2);
                        
                        const minY = Math.max(paddingRatio, topMarginRatio);
                        const maxY = 1 - paddingRatio;
                        const y = minY + Math.random() * (maxY - minY);
                        
                        let overlap = false;
                        for (const ball of data) {
                            const dx = x - ball.x;
                            const dy = y - ball.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < actualRadiusRatio * 2 + marginRatio) {
                                overlap = true;
                                break;
                            }
                        }
                        
                        if (!overlap) {
                            data.push({ x, y, r: actualRadiusRatio, n: i });
                            placed = true;
                        }
                        attempts++;
                    }
                    if (!placed) { placedAll = false; break; }
                }
                if (!placedAll) actualRadiusRatio *= 0.9;
            }

            if (!placedAll) {
                for (let i = data.length + 1; i <= count; i++) {
                    const x = paddingRatio + Math.random() * (1 - paddingRatio * 2);
                    const minY = Math.max(paddingRatio, topMarginRatio);
                    const y = minY + Math.random() * (1 - paddingRatio - minY);
                    data.push({ x, y, r: actualRadiusRatio, n: i });
                }
            }
            return data;
        }

            if (balls.length === 0) return;
            const scale = canvas.width / Math.max(1, container.clientWidth);
            if (targetNumber > 1) {
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#8c72d5';
                ctx.lineWidth = Math.max(5 * scale, balls[0].radius * .36);
                ctx.shadowColor = '#b2a0eb';

                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#e7e1ff';
                ctx.lineWidth = Math.max(1.5 * scale, balls[0].radius * .09);
                traceConnections();
                ctx.stroke();
                ctx.restore();
            }
            if (isDrawing && targetNumber > 1 && targetNumber <= balls.length) {
                const last = balls[targetNumber - 2];
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(last.x, last.y);

                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.restore();
            }
            for (const ball of balls) {
                const reached = ball.number < targetNumber;
                const r = ball.radius;
                const depth = Math.min(5 * scale, r * .14);
                const y = ball.y + (reached ? depth * .48 : 0);
                ctx.save();
                ctx.beginPath();
                ctx.arc(ball.x, ball.y + depth, r, 0, Math.PI * 2);
                ctx.fillStyle = reached ? '#329d94' : '#bcb0d3';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ball.x, y, r, 0, Math.PI * 2);
                const face = ctx.createRadialGradient(ball.x - r * .3, y - r * .5, r * .05, ball.x, y, r * 1.3);
                face.addColorStop(0, reached ? '#b7ffeb' : '#ffffff');
                face.addColorStop(.62, reached ? '#74ead1' : '#fffcff');
                face.addColorStop(1, reached ? '#35c6b4' : '#e9e0f8');
                ctx.fillStyle = face;
                ctx.shadowColor = '#51416a1a';
                ctx.shadowBlur = reached ? 0 : 6 * scale;
                ctx.shadowOffsetY = 2 * scale;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
                ctx.lineWidth = Math.max(1.2 * scale, Math.min(2.2 * scale, r * .06));
                ctx.strokeStyle = reached ? '#308e87' : '#82709d';
                ctx.stroke();
                if (r > 13 * scale) {
                    ctx.beginPath();
                    ctx.arc(ball.x, y, r - 4 * scale, Math.PI * 1.12, Math.PI * 1.88);
                    ctx.strokeStyle = '#ffffffbb';
                    ctx.lineWidth = 2 * scale;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                ctx.fillStyle = reached ? '#204d50' : '#372d52';
                ctx.font = `700 ${r * 1.05}px "M PLUS Rounded 1c", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ball.number, ball.x, y + r * .035);
                ctx.restore();
            }
        }

        function celebrateConnection(ball) {
            if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
            connectionEffects.push({ x: ball.x, y: ball.y, r: ball.radius, start: performance.now() });
            if (connectionAnimation === null) connectionAnimation = requestAnimationFrame(animateConnectionEffects);
        }

        function animateConnectionEffects(now) {
            feedbackCtx.clearRect(0, 0, feedbackCanvas.width, feedbackCanvas.height);
            connectionEffects = connectionEffects.filter(effect => now - effect.start < 480);
            for (const effect of connectionEffects) {
                const p = Math.max(0, (now - effect.start) / 480);
                const distance = effect.r * (1.12 + p * .7);
                feedbackCtx.save();
                feedbackCtx.globalAlpha = (1 - p) * .8;
                feedbackCtx.beginPath();
                feedbackCtx.arc(effect.x, effect.y, distance, 0, Math.PI * 2);
                feedbackCtx.strokeStyle = '#55c6b5';
                feedbackCtx.lineWidth = Math.max(1, effect.r * .035);
                feedbackCtx.stroke();
                for (let i = 0; i < 8; i++) {
                    const angle = i * Math.PI / 4;
                    const x = effect.x + Math.cos(angle) * distance;
                    const y = effect.y + Math.sin(angle) * distance;
                    const size = effect.r * .12 * (1 - p * .5);
                    feedbackCtx.beginPath();
                    feedbackCtx.moveTo(x, y - size);
                    feedbackCtx.lineTo(x + size * .5, y);
                    feedbackCtx.lineTo(x, y + size);
                    feedbackCtx.lineTo(x - size * .5, y);
                    feedbackCtx.closePath();
                    feedbackCtx.fillStyle = i % 2 ? '#b399e3' : '#e6ae3d';
                    feedbackCtx.fill();
                }
                feedbackCtx.restore();
            }
            connectionAnimation = connectionEffects.length ? requestAnimationFrame(animateConnectionEffects) : null;
        }

            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return { x: (clientX - rect.left) * canvas.width / rect.width, y: (clientY - rect.top) * canvas.height / rect.height };
        }

        function handlePointerDown(e) {
            if (!isDrawingAllowed) return;
            isDrawing = true;
            pointerPos = getPointerPos(e);
            checkHit();
            updateSoundEngine();
            draw();
        }

        function handlePointerMove(e) {
            if (!isDrawingAllowed) return;
            e.preventDefault(); // タッチ操作中のスクロールを防止
            if (!isDrawing) return;
            pointerPos = getPointerPos(e);
            checkHit();
            updateSoundEngine();
            draw();
        }

        function handlePointerUp() {
            isDrawing = false;
            updateSoundEngine();
            draw();
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);
        window.addEventListener('touchcancel', handlePointerUp);

        function listenRoom() {
            if (roomUnsubscribe) roomUnsubscribe();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            
            roomPreviousState = '';
            
            roomUnsubscribe = onSnapshot(roomRef, (snapshot) => {
                if (!snapshot.exists()) return;
                const data = snapshot.data();
                const playersData = data.players || {};
                currentRoomData = data;
                updateRoomSettings(data);
                
                if (data.state === 'waiting') {
                    updateWaitingList(playersData);
                    if (roomPreviousState !== 'waiting') {
                        clearInterval(multiCountdownInterval);
                        clearTimeout(progressTimeout);
                        progressTimeout = null;
                        centerMessage.classList.add('hidden');
                        stopConfetti();
                        resetTimer();
                        isDrawingAllowed = false;
                        showMultiSettingsError();
                        showModal('roomWaitingUI');
                    }
                }

                if (roomPreviousState !== 'playing' && data.state === 'playing') {
                    hideModal();
                    applyBallsData(data.ballLayout);
                    targetNumber = Math.min(balls.length + 1, (playersData[currentUserId]?.progress || 0) + 1);
                    isDrawing = false;
                    
                    // ★ マルチプレイ専用UIを表示する
                    document.getElementById('multiRankUI').classList.remove('hidden');
                    document.getElementById('multiplayerMarathon').classList.remove('hidden');
                    updateMultiplayerStatus(playersData, data.ballCount);
                    
                    startMultiCountdown();
                }

                if (data.state === 'playing') {
                    updateMultiplayerStatus(playersData, data.ballCount);
                    
                    const allCleared = Object.values(playersData).every(p => p.time !== null);
                    if (allCleared && getSettingsOwner(data) === currentUserId) {
                        finishRoomIfCleared(roomRef, data.roundId || 0);
                    }
                }

                if (roomPreviousState !== 'finished' && data.state === 'finished') {
                    clearInterval(multiCountdownInterval);
                    isDrawingAllowed = false;
                    isDrawing = false;
                    stopTimer();
                    centerMessage.classList.add('hidden');
                    stopConfetti();
                    showResult(playersData);
                }

                roomPreviousState = data.state;
                
            }, (error) => {
                console.error("Room sync error", error);
                showAlert("つうしんが きれました");
            });
        }

                    const players = Object.values(data.players || {});

                        players.length > 0 && players.every(player => player.time !== null)) {
                        transaction.update(roomRef, { state: 'finished', lastActivity: Date.now() });

        // ★ 新しいマルチプレイUI更新関数（順位とマラソンバーの更新）
        function updateMultiplayerStatus(players, totalBalls) {
            // --- 1. 順位の計算 ---
            const list = Object.entries(players).map(([uid, p]) => ({ uid, ...p })).sort((a, b) => {
                if (a.time !== null && b.time !== null) return a.time - b.time;
                if (a.time !== null) return -1;
                if (b.time !== null) return 1;
                return b.progress - a.progress;
            });

            const totalPlayers = list.length;
            let myRank = 1;
            for (let i = 0; i < list.length; i++) {
                if (list[i].uid === currentUserId) {
                    myRank = i + 1;
                    break;
                }
            }

            document.getElementById('currentRankDisplay').innerText = myRank;
            document.getElementById('totalPlayersDisplay').innerText = totalPlayers;

            // 同じアイコンを保ち、進捗の更新時は位置だけを動かす。
            const track = document.getElementById('marathonTrack');
            const icons = new Map(Array.from(track.children).map(icon => [icon.dataset.playerId, icon]));
            const count = Math.max(1, Number(totalBalls) || 1);
            Object.entries(players).forEach(([uid, player]) => {
                let icon = icons.get(uid);
                if (!icon) {
                    icon = document.createElement('div');
                    icon.dataset.playerId = uid;
                    icon.className = 'marathon-runner';
                    const label = document.createElement('span');
                    label.className = 'runner-name';
                    const avatar = document.createElement('span');
                    avatar.className = 'runner-avatar';
                    icon.append(label, avatar);
                    track.appendChild(icon);
                }
                const isMe = uid === currentUserId;
                const progress = Math.max(0, Number(player.progress) || 0);
                icon.style.left = Math.min(100, progress / count * 100) + '%';
                icon.classList.toggle('is-me', isMe);
                icon.classList.toggle('is-finished', player.time !== null);
                icon.children[0].textContent = isMe ? 'あなた' : player.name;
                icon.children[1].textContent = Array.from(player.name || '？')[0];
                icon.setAttribute('role', 'img');
                icon.setAttribute('aria-label', `${player.name}、${Math.min(count, progress)}こ / ${count}こ`);
            });
            icons.forEach((icon, uid) => {
                if (!Object.prototype.hasOwnProperty.call(players, uid)) icon.remove();
            });
        }

                    msgText.innerText = 'スタート！';

                    msgDiv.classList.add('hidden');

            }, 1000);

        let progressTimeout = null;
        let pendingProgress = -1;

        async function writePlayerProgress(roomId, roundId, progress, time = null) {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            await runTransaction(db, async transaction => {
                const snapshot = await transaction.get(roomRef);
                if (!snapshot.exists()) return;
                const data = snapshot.data();
                if (data.state !== 'playing' || (data.roundId || 0) !== roundId || !data.players?.[currentUserId]) return;
                // 完了済みの記録を、遅れて届いた途中経過で巻き戻さない。
                if (data.players[currentUserId].time !== null) return;
                const updates = {
                    [`players.${currentUserId}.progress`]: Math.min(normalizeBallCount(data.ballCount), Math.max(0, progress)),
                    lastActivity: Date.now()
                };
                if (time !== null) updates[`players.${currentUserId}.time`] = time;
                transaction.update(roomRef, updates);
            });
        }

        function sendProgressThrottled(prog) {
            pendingProgress = prog;
            if (!progressTimeout && currentRoomId) {
                const roomId = currentRoomId;
                const roundId = currentRoomData?.roundId || 0;
                progressTimeout = setTimeout(async () => {
                    progressTimeout = null;
                    const progress = pendingProgress;
                    if (currentRoomId !== roomId) return;
                    try {
                        await writePlayerProgress(roomId, roundId, progress);
                    } catch(e) { console.error(e); }
                }, 400);
            }
        }

        async function sendClearTime(time) {
            if (!currentRoomId) return;
            clearTimeout(progressTimeout);
            progressTimeout = null;
            try {
                await writePlayerProgress(currentRoomId, currentRoomData?.roundId || 0, balls.length, time);
            } catch(e) { console.error(e); }
        }

        function showResult(players) {
            // UIDを含めてリスト化し、タイム順にソートする
            const list = Object.entries(players).map(([uid, p]) => ({ uid, ...p })).sort((a, b) => {
                if (a.time === null && b.time === null) return 0;
                if (a.time === null) return 1;
                if (b.time === null) return -1;
                return a.time - b.time;
            });
            
            const isWinner = list.length > 0 && list[0].uid === currentUserId && list[0].time !== null;

            const listDiv = document.getElementById('resultList');
            listDiv.innerHTML = '';
            
            list.forEach((p, index) => {
                const rank = index + 1;
                const timeStr = p.time !== null ? p.time.toFixed(2) + '秒' : 'リタイア';
                let medal = '<span class="text-xl">👏</span>';
                let bgClass = 'bg-slate-50 border-slate-200';
                
                if (p.time !== null) {
                    if (rank === 1) { medal = '<span class="text-3xl drop-shadow-md">🥇</span>'; bgClass = 'bg-yellow-50 border-yellow-300 shadow-sm'; }
                    else if (rank === 2) { medal = '<span class="text-2xl drop-shadow-md">🥈</span>'; bgClass = 'bg-slate-100 border-slate-300'; }
                    else if (rank === 3) { medal = '<span class="text-2xl drop-shadow-md">🥉</span>'; bgClass = 'bg-orange-50 border-orange-200'; }
                }

                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-3 sm:p-4 rounded-xl border-2 ${bgClass}`;
                div.innerHTML = `
                    <div class="flex items-center gap-3 font-bold">
                        <div class="w-10 text-center">${medal}</div>
                        <span class="text-lg sm:text-xl text-slate-700">${p.name}</span>
                    </div>
                    <div class="font-mono font-bold text-lg sm:text-xl ${p.time !== null ? 'text-blue-600' : 'text-slate-400'}">${timeStr}</div>
                `;
                listDiv.appendChild(div);
            });

            startConfetti({
                title: isWinner ? 'ゆうしょう！' : 'ナイスプレイ！',
                subtitle: isWinner ? '1い おめでとう！' : 'さいごまで よくがんばった！'
            });
            showModal('roomResultUI');
        }

        async function leaveCurrentRoom() {
            const roomId = currentRoomId;
            if (roomUnsubscribe) roomUnsubscribe();
            roomUnsubscribe = null;
            currentRoomId = null;
            currentRoomData = null;
            clearInterval(multiCountdownInterval);
            multiCountdownInterval = null;
            clearTimeout(progressTimeout);
            progressTimeout = null;
            pendingProgress = -1;
            isDrawingAllowed = false;
            isDrawing = false;
            if (!roomId || !currentUserId || !isFirebaseReady) return;
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                await runTransaction(db, async transaction => {
                    const snapshot = await transaction.get(roomRef);
                    if (!snapshot.exists()) return;
                    const data = snapshot.data();
                    if (!data.players?.[currentUserId]) return;
                    const oldOrder = getPlayerOrder(data);
                    const order = oldOrder.filter(uid => uid !== currentUserId);
                    const ownerId = getSettingsOwner(data);
                    const successor = oldOrder[(oldOrder.indexOf(currentUserId) + 1) % oldOrder.length];
                    const newOwnerId = ownerId === currentUserId ? (order.includes(successor) ? successor : order[0] || null) : ownerId;
                    const updates = {
                        [`players.${currentUserId}`]: deleteField(),
                        playerOrder: order, settingsOwnerId: newOwnerId,
                        lastActivity: Date.now()
                    };
                    // プレイ中に担当者が抜けたときは、次の担当者を再戦時に飛ばさない。
                    if (data.state !== 'waiting' && (ownerId === currentUserId || data.nextSettingsOwnerId === currentUserId)) {
                        updates.nextSettingsOwnerId = newOwnerId;
                    }
                    if (order.length === 0) {
                        updates.state = 'waiting';
                        updates.nextSettingsOwnerId = null;
                        updates.ballLayout = [];
                    } else if (data.state === 'playing' && order.every(uid => data.players[uid].time !== null)) {
                        updates.state = 'finished';
                    }
                    transaction.update(roomRef, updates);
                });
            } catch(e) {
                console.error('へやからの退出にしっぱいしました', e);
            }
        }

        document.getElementById('leaveRoomBtn').addEventListener('click', () => modeSingleBtn.click());
        cancelWaitingBtn.addEventListener('click', () => modeSingleBtn.click());



        // ==========================================
        // UI & イベントリスナー
        // ==========================================

        const clickSoundElements = [
            modeSingleBtn, modeMultiBtn, openSettingsBtn, closeSettingsBtn, applySettingsBtn,
            document.getElementById('resetBtn'), document.getElementById('nextBtn'),
            document.getElementById('leaveRoomBtn'), closeSetupBtn, cancelWaitingBtn,
            document.getElementById('joinRoomBtn'), document.getElementById('startMultiBtn'),
            document.getElementById('backToWaitingBtn'), document.getElementById('closeAlertBtn'),
            voiceToggle, seToggle
        ];
        clickSoundElements.forEach(el => {
            if (el) el.addEventListener('click', playClick);
        });

        function closeSettings() {
            hideModal();
            isVoiceEnabled = voiceToggle.checked;
            isSoundEffectsEnabled = seToggle.checked;
            
            if (isVoiceEnabled && window.speechSynthesis) {
                wakeupVoice();
            }
            
            const currentCount = validateBallCount();
            if (currentCount !== previousBallCount) {
                previousBallCount = currentCount;
                if (gameMode === 'single') initSingleGame();
            }
        }

        openSettingsBtn.addEventListener('click', () => {
            previousBallCount = validateBallCount();
            showModal('settingsUI');
        });

        closeSettingsBtn.addEventListener('click', closeSettings);
        applySettingsBtn.addEventListener('click', closeSettings);
        
        function resizeCanvasAndDraw() {
            sizeGameCanvas();
            clearConnectionEffects();
            if (ballsData && ballsData.length > 0) {
                applyBallsData(ballsData);
                draw();
            }
        }

        titleScreen.addEventListener('click', () => {
            resumeAudioContext(); // 音声エンジンのアンロック
            playBuffer('enter'); // スタート音の再生

            // ★ 音声合成エンジンのウォーミングアップ（「1」の読み上げのラグをなくす）
            wakeupVoice();

            titleScreen.classList.add('opacity-0');
            setTimeout(() => {
                titleScreen.classList.add('hidden');
                resizeCanvasAndDraw(); 
            }, 500);
        });

        closeSetupBtn.addEventListener('click', () => {
            modeSingleBtn.click(); 
        });

        document.getElementById('resetBtn').addEventListener('click', initSingleGame);
        document.getElementById('nextBtn').addEventListener('click', initSingleGame);
        
        function validateBallCount() {
            const count = normalizeBallCount(ballCountInput.value);
            ballCountInput.value = count;
            return count;
        }

        ballCountInput.addEventListener('change', validateBallCount);

        ballCountInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                validateBallCount();
                closeSettings();
                ballCountInput.blur();
            }
        });

        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(() => {
                resizeCanvasAndDraw();
            }, 200);
        });

        // The finish is a short full-screen show, not confetti behind a modal.
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        const victoryShow = document.getElementById('victoryShow');
        let confettis = [];
        let confettiAnimationId = null;
        let victoryTimers = [];
        let victorySoundNodes = [];
        let victoryStartedAt = 0;
        let victoryPreviousFrame = 0;
        let victoryBurstIndex = 0;
        let victoryRunning = false;
        let victorySize = { width: 1, height: 1, ratio: 1 };
        const victoryBurstTimes = [0, 0, 450, 950, 1500, 2350, 3200];
        const victoryColors = ['#ffe76c', '#ff79b7', '#73ffe1', '#c5a2ff', '#ffffff', '#ffa65b'];

        function scheduleVictoryTask(callback, delay) {
            const id = setTimeout(() => {
                victoryTimers = victoryTimers.filter(timer => timer !== id);
                callback();
            }, delay);
            victoryTimers.push(id);
        }

        function resizeVictoryCanvas() {
            const width = window.innerWidth || container.clientWidth;
            const height = window.innerHeight || container.clientHeight;
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            if (width !== victorySize.width || height !== victorySize.height || ratio !== victorySize.ratio) {
                confettis.forEach(p => { p.x *= width / victorySize.width; p.y *= height / victorySize.height; });
                victorySize = { width, height, ratio };
                confettiCanvas.width = Math.round(width * ratio);
                confettiCanvas.height = Math.round(height * ratio);
            }
            confettiCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function playVictoryFanfare() {
            if (!isSoundEffectsEnabled || !audioCtx || typeof audioCtx.createOscillator !== 'function') return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            function note(frequency, offset, duration, volume, type = 'triangle') {
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, now + offset);
                gain.gain.setValueAtTime(0, now + offset);
                gain.gain.linearRampToValueAtTime(volume, now + offset + .015);
                gain.gain.exponentialRampToValueAtTime(.001, now + offset + duration);
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.start(now + offset);
                oscillator.stop(now + offset + duration + .03);
                victorySoundNodes.push(oscillator);
            }
            // Bright ascending brass/chimes followed by a sustained major chord.
            [[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.42],[783.99,.64],[1046.5,.8]].forEach(([frequency,offset]) => {
                note(frequency, offset, .3, .043);
                note(frequency * 2, offset, .42, .012, 'sine');
            });
            [523.25,659.25,783.99,1046.5].forEach(frequency => note(frequency,.98,.85,.023));
            [[130.81,0],[196,.24],[261.63,.42],[130.81,.98]].forEach(([frequency,offset]) => note(frequency,offset,.45,.045));
        }

        function emitVictoryBurst(index, now) {
            const { width:w, height:h } = victorySize;
            const unit = Math.max(.7, Math.min(1.5, w / 750));
            const compact = w < 600;
            const spawn = (x, y, angle, spread, count, speed, kind) => {
                for (let i = 0; i < count; i++) {
                    const direction = angle + (Math.random() - .5) * spread;
                    const velocity = speed * (.45 + Math.random() * .7) * unit;
                    confettis.push({
                        x, y, vx:Math.cos(direction) * velocity, vy:Math.sin(direction) * velocity,
                        size:(7 + Math.random() * 11) * unit,
                        color:victoryColors[Math.floor(Math.random() * victoryColors.length)],
                        rotation:Math.random() * Math.PI * 2, spin:(Math.random() - .5) * 10,
                        birth:now, life:1800 + Math.random() * 1900,
                        kind:kind || (i % 4 === 0 ? 'star' : i % 3 === 0 ? 'spark' : 'ribbon'),
                        gravity:kind === 'star' ? 130 : 270 + Math.random() * 160
                    });
                }
            };
            if (index === 0) spawn(w * .5,h * .48,0,Math.PI * 2,compact ? 54 : 90,560,'star');
            else if (index === 1 || index === 4) {
                spawn(w * .02,h * .88,-Math.PI * .32,.65,compact ? 42 : 65,900);
                spawn(w * .98,h * .88,-Math.PI * .68,.65,compact ? 42 : 65,900);
            } else {
                const x = index % 2 ? w * .75 : w * .25;
                const y = index === 6 ? h * .3 : h * .35;
                spawn(x,y,0,Math.PI * 2,compact ? 38 : 65,310,index % 2 ? 'star' : null);
            }
            const cap = compact ? 240 : 380;
            if (confettis.length > cap) confettis.splice(0, confettis.length - cap);
        }

        function victoryStarPath(context, radius) {
            context.beginPath();
            for (let i = 0; i < 10; i++) {
                const angle = -Math.PI / 2 + i * Math.PI / 5;
                const r = i % 2 ? radius * .43 : radius;
                if (i === 0) context.moveTo(Math.cos(angle) * r,Math.sin(angle) * r);
                else context.lineTo(Math.cos(angle) * r,Math.sin(angle) * r);
            }
            context.closePath();
        }

        function animateConfetti(now = performance.now()) {
            if (!victoryRunning) return;
            resizeVictoryCanvas();
            const {width:w,height:h} = victorySize;
            const age = now - victoryStartedAt;
            const dt = Math.min(.04, Math.max(0, (now - victoryPreviousFrame) / 1000));
            victoryPreviousFrame = now;
            confettiCtx.clearRect(0,0,w,h);
            while (victoryBurstIndex < victoryBurstTimes.length && age >= victoryBurstTimes[victoryBurstIndex]) {
                emitVictoryBurst(victoryBurstIndex++, now);
            }
            // One expanding impact ring; no repeated flashes or strobing.
            if (age < 850) {
                const p = age / 850;
                confettiCtx.save();
                confettiCtx.globalAlpha = (1 - p) * .8;
                confettiCtx.strokeStyle = '#fff1a0';
                confettiCtx.lineWidth = 5 * (1 - p) + 1;
                confettiCtx.beginPath();
                confettiCtx.arc(w * .5,h * .48,Math.max(1, Math.hypot(w,h) * .6 * p),0,Math.PI * 2);
                confettiCtx.stroke();
                confettiCtx.restore();
            }
            confettis = confettis.filter(p => now - p.birth < p.life && p.y < h + 100);
            for (const p of confettis) {
                p.vy += p.gravity * dt;
                p.vx *= Math.pow(.985,dt * 60);
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.rotation += p.spin * dt;
                const life = (now - p.birth) / p.life;
                confettiCtx.save();
                confettiCtx.globalAlpha = Math.min(1,(1 - life) * 3);
                confettiCtx.translate(p.x,p.y);
                confettiCtx.rotate(p.rotation);
                confettiCtx.fillStyle = p.color;
                if (p.kind === 'star') {
                    victoryStarPath(confettiCtx,p.size);
                    confettiCtx.shadowColor = p.color;
                    confettiCtx.shadowBlur = 9;
                    confettiCtx.fill();
                } else if (p.kind === 'spark') {
                    confettiCtx.beginPath();
                    confettiCtx.moveTo(0,-p.size);
                    confettiCtx.lineTo(p.size * .3,0);
                    confettiCtx.lineTo(0,p.size);
                    confettiCtx.lineTo(-p.size * .3,0);
                    confettiCtx.closePath();
                    confettiCtx.fill();
                } else {
                    const flip = .3 + Math.abs(Math.cos(life * 12)) * .7;
                    confettiCtx.fillRect(-p.size * .35,-p.size * .7,p.size * .7 * flip,p.size * 1.4);
                }
                confettiCtx.restore();
            }
            if (age < 6500) confettiAnimationId = requestAnimationFrame(animateConfetti);
            else stopConfetti();
        }

        function startConfetti({title = 'クリア！', subtitle = 'ぜんぶ つながった！'} = {}) {
            stopConfetti();
            victoryRunning = true;
            victoryStartedAt = performance.now();
            victoryPreviousFrame = victoryStartedAt;
            victoryBurstIndex = 0;
            document.getElementById('victoryTitle').textContent = title;
            document.getElementById('victorySubtitle').textContent = subtitle;
            victoryShow.classList.toggle('long-title',Array.from(title).length > 4);
            // Commit the hidden state so a second finish restarts the CSS entrance.
            void victoryShow.offsetWidth;
            victoryShow.classList.remove('hidden');
            document.body.classList.add('victory-active');
            playVictoryFanfare();
            const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
            if (!reducedMotion) animateConfetti(victoryStartedAt);
            // All scheduled work belongs to this finish and is canceled on restart/exit.
            scheduleVictoryTask(() => victoryShow.classList.add('hidden'),reducedMotion ? 1600 : 2700);
            scheduleVictoryTask(stopConfetti,6600);
        }

        function stopConfetti() {
            victoryRunning = false;
            if (confettiAnimationId !== null) cancelAnimationFrame(confettiAnimationId);
            confettiAnimationId = null;
            victoryTimers.forEach(clearTimeout);
            victoryTimers = [];
            victorySoundNodes.forEach(node => { try { node.stop(); } catch(e) { /* Already ended. */ } });
            victorySoundNodes = [];
            confettis = [];
            victoryShow.classList.add('hidden');
            document.body.classList.remove('victory-active');
            confettiCtx.setTransform(1,0,0,1,0,0);
            confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
        }


        // 初期起動
        window.onload = initSingleGame;

    </script>
</body>
</html>
